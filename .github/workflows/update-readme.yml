name: Update README with Starter Kits

on:
  push:
    branches:
      - master
    paths:
      - 'plugins.json'
      - 'README_plugin.md'
      - 'update-readme.js'
      - '.github/workflows/update-readme.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Update README with Starter Kits
        run: node update-readme.js

      - name: Extract flat package lists
        run: node extract-plugin-packages.js

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add README.md AGENTS.md plugins-packages-owner.json plugins-packages-collaborator.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update README with latest starter kits from template"
            # Other workflows (e.g. Changelog) push to the same branch on the same event;
            # rebase onto whatever landed first and retry instead of failing the push.
            for attempt in 1 2 3; do
              git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref }} && exit 0
              echo "Push attempt $attempt failed, retrying..."
              sleep $((attempt * 5))
            done
            exit 1
          fi
