name: Changelog

# Regenerates CHANGELOG.md from the commit history (git-cliff + cliff.toml) on every
# push. The commit made here uses GITHUB_TOKEN, so it does not trigger another run.
# It adds a commit after each push: pull (rebase) before pushing locally.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
          args: -o CHANGELOG.md

      # Other workflows may push to master while this one runs (non-fast-forward
      # rejections on the profile repo): commit, then rebase + push with retries.
      - name: Commit updated CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "Update CHANGELOG"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep $((attempt * 5))
          done
          exit 1
